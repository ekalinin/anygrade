# Dependabot version updates. Configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The module is the only manifest: one go.mod at the repo root.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
