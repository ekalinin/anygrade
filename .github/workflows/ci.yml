# Build, vet, gofmt and the full test suite on every pull request and on main.
# Also callable from other workflows (workflow_call) so the release workflow can
# gate publishing on the same job instead of duplicating the steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR supersedes the previous run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # build + vet + gofmt + unit tests, the docker runner tests included:
      # they run against the daemon on the runner, using alpine:3. Those tests
      # skip themselves when no daemon is reachable, which is right on a
      # developer machine and wrong here - the docker runner is the only
      # sandbox anygrade has, so losing its coverage must not look like a
      # passing build. The variable turns that skip into a failure.
      - run: make check
        env:
          ANYGRADE_REQUIRE_DOCKER: "1"
      # End-to-end suite: spawns the real binary and drives CLI, HTTP and git.
      # Needs the git binary (preinstalled on the runner), no docker.
      - run: make e2e
      # The same suite plus the docker-gated scenarios, which grade real pushes
      # in real containers. It runs after the docker-free one so a failure that
      # has nothing to do with the sandbox is reported by the cheaper job first.
      # There is no skip here: the `docker` build tag is the statement that a
      # daemon is running, so its absence is a failure, exactly as
      # ANYGRADE_REQUIRE_DOCKER makes it one for the unit tests above.
      - run: make e2e-docker
      # Reachability-based dependency scan: it fails only on vulnerabilities
      # the code actually calls, so an advisory in a module we merely require
      # does not turn the build red.
      - run: make vulncheck
