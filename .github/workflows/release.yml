# Publish a GitHub release for a pushed vX.Y.Z tag: cross-compiled binaries,
# archives, checksums and a grouped changelog, all built by goreleaser from
# .goreleaser.yaml. The built-in GITHUB_TOKEN is enough; no secrets to set up.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Same job the pull request ran: a red test suite must not become a release.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # goreleaser reads the whole history to build the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
