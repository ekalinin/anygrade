# Deploy the static landing page (landing/) to GitHub Pages.
# GitHub Pages "Deploy from a branch" only allows the repo root or /docs, so the
# landing/ folder is published through Actions instead. configure-pages with
# enablement:true turns on Pages in "GitHub Actions" mode automatically, so this
# does not depend on the repository setting being flipped by hand first.
name: Deploy landing to Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "Makefile"  # holds the landing-build target
      - ".github/workflows/pages.yml"
  # Called by release.yml once a release is published, so the page picks up the
  # new version. An `on: release` trigger would never fire: goreleaser creates
  # the release with GITHUB_TOKEN, and events from that token start no runs.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      # `gh release view` reports the latest published release (drafts and
      # pre-releases excluded), so the page always advertises a stable version.
      # Empty until the first release exists - then the page says "latest".
      - name: Resolve the latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"
      - run: make landing-build LANDING_VERSION=${{ steps.rel.outputs.version }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/landing
      - id: deployment
        uses: actions/deploy-pages@v5
