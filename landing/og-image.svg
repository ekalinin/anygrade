<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="8" fill="#58a6ff"/>

  <!-- wordmark -->
  <text x="80" y="150" class="mono" font-size="52" font-weight="700" fill="#58a6ff">anygrade</text>

  <!-- headline -->
  <text x="80" y="245" class="sans" font-size="52" font-weight="700" fill="#e6edf3">A single Go binary that turns any</text>
  <text x="80" y="312" class="sans" font-size="52" font-weight="700" fill="#e6edf3">git repo of course tasks into a</text>
  <text x="80" y="379" class="sans" font-size="52" font-weight="700" fill="#e6edf3">grading system.</text>

  <!-- sub -->
  <text x="80" y="440" class="mono" font-size="28" fill="#8b949e">Students push. It grades. You teach.</text>

  <!-- faux terminal with push output -->
  <g>
    <rect x="80" y="480" width="1040" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="106" cy="506" r="6" fill="#ff5f56"/>
    <circle cx="126" cy="506" r="6" fill="#ffbd2e"/>
    <circle cx="146" cy="506" r="6" fill="#27c93f"/>
    <text x="104" y="552" class="mono" font-size="22" fill="#8b949e">remote:</text>
    <text x="209" y="552" class="mono" font-size="22" fill="#e6edf3">anygrade:</text>
    <text x="341" y="552" class="mono" font-size="22" fill="#58a6ff">2 task(s)</text>
    <text x="473" y="552" class="mono" font-size="22" fill="#e6edf3">detected</text>
    <text x="592" y="552" class="mono" font-size="22" fill="#8b949e">&#183; 01-intro</text>
    <text x="750" y="552" class="mono" font-size="22" fill="#3fb950">submission #142 queued</text>
  </g>

  <!-- footer url -->
  <text x="80" y="612" class="sans" font-size="22" fill="#8b949e">github.com/ekalinin/anygrade</text>
</svg>
