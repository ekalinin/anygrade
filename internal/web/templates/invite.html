{{define "content"}}
<section class="login">
<h1>{{t "invite.title"}}</h1>
{{if .Invalid}}
<p class="flash error">{{t "invite.invalid"}}</p>
{{else}}
<p>{{t "invite.welcome"}} <strong>{{.Login}}</strong>. {{t "invite.activation_creates"}}</p>
<p class="hint">{{t "invite.ssh_later"}}</p>
<form method="post" action="/invite/{{.Token}}">
  <button type="submit">{{t "invite.activate"}}</button>
</form>
{{end}}
</section>
{{end}}
