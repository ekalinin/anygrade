{{define "content"}}
<h1>Leaderboard</h1>
{{if .Anonymize}}<p class="hint">Names are anonymized; you are highlighted.</p>{{end}}
<table class="leaderboard">
  <thead><tr><th>#</th><th>Student</th><th>Total</th></tr></thead>
  <tbody>
  {{range .Rows}}
  <tr{{if .Self}} class="self"{{end}}>
    <td>{{.Rank}}</td>
    <td>{{.Name}}{{if .Self}} <span class="hint">(you)</span>{{end}}</td>
    <td>{{.Total}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
