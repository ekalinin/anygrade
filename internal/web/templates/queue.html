{{define "content"}}
<h1>Queue</h1>
<div hx-ext="sse" sse-connect="/queue/stream">
{{if .Rows}}
<table class="queue">
  <thead><tr><th>#</th><th>Student</th><th>Task</th><th>Status</th><th>Received</th><th>Note</th><th></th></tr></thead>
  <tbody>
  {{range .Rows}}{{template "queue-row" .}}{{end}}
  </tbody>
</table>
{{else}}<p class="hint">Nothing pending: no queued, running, or failing submissions.</p>{{end}}
</div>
{{end}}
