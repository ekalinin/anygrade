{{define "queue-row"}}<tr sse-swap="sub-{{.Sub.ID}}" hx-swap="outerHTML">
  <td class="key"><a href="/submissions/{{.Sub.ID}}">#{{.Sub.ID}}</a></td>
  <td><a href="/students/{{.Login}}">{{.Login}}</a></td>
  <td>{{.Sub.TaskID}}</td>
  <td><span class="badge {{statusClass .Status}}">{{tStatus .Status}}</span></td>
  <td>{{fmtTime .Sub.ReceivedAt}}</td>
  <td>{{if .Sub.WorkerNote}}{{.Sub.WorkerNote}}{{end}}</td>
  <td>
    {{if or (eq .Sub.Status "queued") (eq .Sub.Status "running")}}
    <form method="post" action="/queue/{{.Sub.ID}}/cancel" class="inline"><button type="submit" class="linklike">{{t "common.cancel"}}</button></form>
    {{end}}
    {{if .CanRecheck}}
    <form method="post" action="/queue/{{.Sub.ID}}/recheck" class="inline"><button type="submit" class="linklike">{{t "common.recheck"}}</button></form>
    {{end}}
  </td>
</tr>{{end}}
