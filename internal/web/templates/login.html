{{define "content"}}
<section class="login">
  <h1>{{t "login.title"}}</h1>
  {{if .Error}}<p class="flash error">{{tFlash .Error}}</p>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>{{t "common.login"}} <input name="login" autocomplete="username" required autofocus></label>
    <label>{{t "login.access_token"}} <input name="token" type="password" autocomplete="current-password" required placeholder="ag_..."></label>
    <button type="submit">{{t "login.submit"}}</button>
  </form>
  <p class="hint">{{t "login.hint"}}</p>
</section>
{{end}}
