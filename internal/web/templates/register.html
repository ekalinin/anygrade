{{define "content"}}
<section class="login">
<h1>Register</h1>
{{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
<form method="post" action="/register">
  <label>Login <input name="login" value="{{.Login}}" required autofocus></label>
  <label>Display name <input name="name" value="{{.Name}}"></label>
  <label>Course code <input name="course_code" required></label>
  <button type="submit">Register</button>
</form>
</section>
{{end}}
